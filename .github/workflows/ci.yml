# jsonmbt 门禁 —— 双层防线（AGENTS.md 纪律 7）
#
#   L1 内层：moon test 语义锚 —— 随工具链漂移，漂移即编译红，fail loud 可接受
#   L2 外层：Go 黑盒驱动 —— 只依赖 exe 产物，独立于 moon 工具链
#   对外承诺的真防线在 L2：L1 红了先查工具链漂移，L2 红了才是产品真缺陷。
#
# 矩阵不含 Windows：native 后端撞 moon#2254（MSVC optimization cliff），
# 本项目一律 MOON_CC=clang，见 docs/MOONBIT_PITFALLS.md。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOON_CC: clang

jobs:
  gate:
    name: gate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Setup Go（层 2 驱动）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Toolchain 指纹
        run: |
          moon version --all
          clang --version
          go version

      # setup-moonbit 只装二进制，registry 索引未初始化 → 依赖解析阶段即红：
      # "Failed to resolve registry dependency ... module was not found in the registry"
      # （前置告警即 "you may need to run `moon update` to update the registry"）。
      - name: 同步 registry 索引
        run: moon update

      # L1 内层
      - name: L1-a build（native，clang）
        run: moon build --target native

      - name: L1-b moon test 语义锚
        run: moon test --target native

      # L1-c .json.mbt 静态门禁（2026-10-07 实测定线，勿删）
      #
      # 实测结论（本仓 Windows 复现，跨平台同机制）：
      #   moon build --target native  **不**检查孤立包（注入类型错仍 rc=0）
      #   moon test --target native  **会**检查（rc=1 [4014]）→ L1-b 已兜底
      #   moon check（全量）**跳过**孤立包；moon check <包名> 才会点名检查
      # 所以本步是「显式点名 + 快速失败」：L1-b 的保护是编译副作用，本步把
      # 「.json.mbt 由 MoonBit 编译器兜底」变成可读的显式契约——目录被删或
      # 改名时本步在 build-plan 阶段就红，而不是等 L1-b 偶然兜住。
      - name: L1-c moon check（.json.mbt 静态门禁）
        run: moon check examples probe/samples

      # L2 外层
      - name: 定位 exe 产物（Windows 有 .exe 后缀，Unix 没有）
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          p="_build/native/debug/build/cmd/jsonmbt/jsonmbt"
          [ -f "$p.exe" ] && p="$p.exe"
          test -f "$p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

      - name: L2 Go 黑盒驱动（rc / stdout / stderr 逐字节 golden）
        run: go run ./tests/driver -exe "${{ steps.exe.outputs.path }}"
